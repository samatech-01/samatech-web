name: Validate and optionally deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Pages (only after publication approval)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:render
      - run: npm run test:detail
      - run: npm run test:store
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run check:release
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
